<text x="590" y="126" fill="#F0FBF5" opacity=".76" font-family="Arial, Helvetica, sans-serif" font-size="18">1.1 Becoming a permanent resident</text>
<text x="590" y="172" fill="#F0FBF5" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="600"><tspan x="590" dy="0">If you wish to be a permanent</tspan><tspan x="590" dy="40">resident or citizen of the</tspan><tspan x="590" dy="40">UK, you should (choose TWO</tspan><tspan x="590" dy="40">answers):</tspan></text>
<line x1="590" y1="345" x2="1110" y2="345" stroke="#75C49A" stroke-width="3" opacity=".55"/>
<text x="590" y="392" fill="#75C49A" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" letter-spacing="2">CORRECT ANSWER</text>
<text x="590" y="438" fill="#F0FBF5" font-family="Arial, Helvetica, sans-serif" font-size="37" font-weight="700"><tspan x="590" dy="0">Respect the rights of</tspan><tspan x="590" dy="48">others, including their</tspan><tspan x="590" dy="48">right to their own</tspan><tspan x="590" dy="48">opinions  •  Look after</tspan><tspan x="590" dy="48">yourself and your family</tspan></text>
