<text x="590" y="438" fill="#F0FBF5" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700"><tspan x="590" dy="0">To look after the area</tspan><tspan x="590" dy="49">in which you live and</tspan><tspan x="590" dy="49">the environment  •  To</tspan><tspan x="590" dy="49">look after yourself and</tspan><tspan x="590" dy="49">your family</tspan></text>
