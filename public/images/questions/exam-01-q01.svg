<text x="590" y="126" fill="#F0FBF5" opacity=".76" font-family="Arial, Helvetica, sans-serif" font-size="18">1.2 The values and principles of the UK</text>
<text x="590" y="172" fill="#F0FBF5" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="600"><tspan x="590" dy="0">What are two responsibilities</tspan><tspan x="590" dy="40">that you will have as a</tspan><tspan x="590" dy="40">British citizen or permanent</tspan><tspan x="590" dy="40">resident of the UK?</tspan></text>
