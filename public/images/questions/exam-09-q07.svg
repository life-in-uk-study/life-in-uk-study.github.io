<text x="590" y="438" fill="#FFF7E4" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700"><tspan x="590" dy="0">Women were given the</tspan><tspan x="590" dy="49">right to vote at the</tspan><tspan x="590" dy="49">age of 21, the same as</tspan><tspan x="590" dy="49">men.</tspan></text>
