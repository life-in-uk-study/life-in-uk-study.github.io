<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Which two responsibilities will you have as a British citizen? Correct answer: To look after yourself and your family  •  To respect the rights of others, including their right to their own opinions</title>
<desc id="desc">Answer memory card shown after answering the question.</desc>
<rect width="1200" height="675" rx="36" fill="#173A32"/>
<circle cx="320" cy="340" r="210" fill="#FFFFFF" opacity=".045"/>
<path d="M205 390l72 72 160-182" fill="none" stroke="#75C49A" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="320" cy="350" r="132" fill="none" stroke="#75C49A" stroke-width="8" opacity=".45"/>
<text x="590" y="82" fill="#75C49A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="2">ANSWER MEMORY CARD · EXAM-09-Q05</text>
<text x="590" y="126" fill="#F0FBF5" opacity=".76" font-family="Arial, Helvetica, sans-serif" font-size="18">1.2 The values and principles of the UK</text>
<text x="590" y="172" fill="#F0FBF5" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="600"><tspan x="590" dy="0">Which two responsibilities</tspan><tspan x="590" dy="40">will you have as a British</tspan><tspan x="590" dy="40">citizen?</tspan></text>
<line x1="590" y1="345" x2="1110" y2="345" stroke="#75C49A" stroke-width="3" opacity=".55"/>
<text x="590" y="392" fill="#75C49A" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" letter-spacing="2">CORRECT ANSWER</text>
<text x="590" y="438" fill="#F0FBF5" font-family="Arial, Helvetica, sans-serif" font-size="35" font-weight="700"><tspan x="590" dy="0">To look after yourself and</tspan><tspan x="590" dy="46">your family  •  To respect</tspan><tspan x="590" dy="46">the rights of others,</tspan><tspan x="590" dy="46">including their right to</tspan><tspan x="590" dy="46">their own opinions</tspan></text>
